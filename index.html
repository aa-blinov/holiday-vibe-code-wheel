<!doctype html>
<html lang="en" data-theme="holiday">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Spin the wheel for a 20-minute coding prompt across 8,500+ micro-SaaS, dev tool, creative app, and holiday project ideas." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Holiday Vibe-Code Wheel" />
    <meta property="og:description" content="Spin the wheel for a 20-minute coding prompt across 8,500+ micro-SaaS, dev tool, and creative app ideas." />
    <meta property="og:url" content="https://aa-blinov.github.io/holiday-vibe-code-wheel/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Holiday Vibe-Code Wheel" />
    <meta name="twitter:description" content="Spin the wheel for a 20-minute coding prompt across 8,500+ micro-SaaS, dev tool, and creative app ideas." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Holiday Vibe-Code Wheel</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('vibe_code_wheel_v1');
          var parsed = raw ? JSON.parse(raw) : null;
          var theme = parsed && parsed.theme === 'paper' ? 'paper' : 'holiday';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'holiday';
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
